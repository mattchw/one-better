name: personal-execution
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: execution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: execution
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execution -d execution"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
