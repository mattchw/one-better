name: Goals checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: execution
          POSTGRES_PASSWORD: ci-disposable-database-password
          POSTGRES_DB: execution
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U execution -d execution"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure disposable test environments
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          const secret = randomBytes(32).toString('hex');
          const passwordA = randomBytes(24).toString('hex');
          const passwordB = randomBytes(24).toString('hex');
          const db = 'postgresql://execution:ci-disposable-database-password@127.0.0.1:55432/';
          writeFileSync('.env.local', `DATABASE_URL=${db}execution\nBETTER_AUTH_SECRET=${secret}\nBETTER_AUTH_URL=http://127.0.0.1:3100\n`);
          writeFileSync('.env.test', `DATABASE_URL=${db}execution_test\nBETTER_AUTH_SECRET=${secret}\nBETTER_AUTH_URL=http://127.0.0.1:3101\nTEST_USER_A_EMAIL=engineer-a@example.test\nTEST_USER_A_PASSWORD=${passwordA}\nTEST_USER_B_EMAIL=engineer-b@example.test\nTEST_USER_B_PASSWORD=${passwordB}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run check
      - run: npm audit
